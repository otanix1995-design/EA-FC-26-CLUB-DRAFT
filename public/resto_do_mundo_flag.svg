<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="100%" height="100%">
  <!-- Navy Background -->
  <rect width="900" height="600" fill="#040817"/>
  
  <g transform="translate(450, 300)" fill="none">
    <!-- Laurel Wreath Group -->
    <g fill="#FFFFFF" stroke="none">
      <!-- Left Stem -->
      <path d="M -15,190 C -120,180 -220,80 -210,-60 C -205,-130 -150,-200 -80,-230 C -82,-220 -135,-180 -190,-60 C -200,60 -100,165 -15,190 Z" opacity="0.9"/>
      
      <!-- Left Leaves -->
      <path d="M -150,-200 C -180,-230 -120,-240 -80,-230 C -110,-215 -135,-210 -150,-200 Z" />
      <path d="M -180,-160 C -220,-185 -160,-200 -125,-185 C -150,-175 -170,-170 -180,-160 Z" />
      <path d="M -205,-110 C -245,-125 -190,-150 -155,-130 C -175,-125 -195,-120 -205,-110 Z" />
      <path d="M -220,-50 C -260,-60 -210,-90 -170,-70 C -190,-65 -210,-60 -220,-50 Z" />
      <path d="M -220,10 C -260,10 -215,-20 -175,0 C -195,0 -210,5 -220,10 Z" />
      <path d="M -205,70 C -245,80 -205,40 -165,60 C -185,60 -200,65 -205,70 Z" />
      <path d="M -175,120 C -210,140 -180,100 -140,110 C -160,110 -170,115 -175,120 Z" />
      <path d="M -125,160 C -155,185 -140,150 -100,150 C -115,150 -120,155 -125,160 Z" />
      <path d="M -60,185 C -80,215 -85,180 -50,175 C -55,175 -58,180 -60,185 Z" />
      
      <!-- Mirror Right Stem & Leaves -->
      <g transform="scale(-1, 1)">
        <path d="M -15,190 C -120,180 -220,80 -210,-60 C -205,-130 -150,-200 -80,-230 C -82,-220 -135,-180 -190,-60 C -200,60 -100,165 -15,190 Z" opacity="0.9"/>
        <path d="M -150,-200 C -180,-230 -120,-240 -80,-230 C -110,-215 -135,-210 -150,-200 Z" />
        <path d="M -180,-160 C -220,-185 -160,-200 -125,-185 C -150,-175 -170,-170 -180,-160 Z" />
        <path d="M -205,-110 C -245,-125 -190,-150 -155,-130 C -175,-125 -195,-120 -205,-110 Z" />
        <path d="M -220,-50 C -260,-60 -210,-90 -170,-70 C -190,-65 -210,-60 -220,-50 Z" />
        <path d="M -220,10 C -260,10 -215,-20 -175,0 C -195,0 -210,5 -220,10 Z" />
        <path d="M -205,70 C -245,80 -205,40 -165,60 C -185,60 -200,65 -205,70 Z" />
        <path d="M -175,120 C -210,140 -180,100 -140,110 C -160,110 -170,115 -175,120 Z" />
        <path d="M -125,160 C -155,185 -140,150 -100,150 C -115,150 -120,155 -125,160 Z" />
        <path d="M -60,185 C -80,215 -85,180 -50,175 C -55,175 -58,180 -60,185 Z" />
      </g>
      
      <!-- Crossed ties at bottom -->
      <path d="M -30,180 L 30,205 L 20,212 L -40,187 Z"/>
      <path d="M 30,180 L -30,205 L -20,212 L 40,187 Z"/>
    </g>

    <!-- Shield Outer Line -->
    <path d="M 0,-185 Q 45,-215 90,-185 Q 135,-215 145,-180 C 150,-80 135,50 0,160 C -135,50 -150,-80 -145,-180 Q -135,-215 -90,-185 Q -45,-215 0,-185 Z" fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linejoin="round"/>

    <!-- White Circle Background for Map -->
    <circle cx="0" cy="-10" r="105" fill="#FFFFFF"/>

    <!-- Map Silhouette in Navy (#040817) -->
    <g fill="#040817">
      <!-- North America -->
      <path d="M -65,-45 C -75,-65 -45,-85 -15,-75 C -5,-65 -20,-45 -30,-35 C -45,-25 -60,-30 -65,-45 Z"/>
      <!-- Central America -->
      <path d="M -35,-30 C -40,-25 -30,-15 -25,-20 Z"/>
      <!-- South America -->
      <path d="M -35,-10 C -20,-20 -5,5 -15,45 C -30,65 -50,40 -40,15 Z"/>
      <!-- Europe -->
      <path d="M -5,-70 C 15,-80 45,-60 35,-45 C 15,-40 0,-50 -5,-70 Z"/>
      <!-- Africa -->
      <path d="M 0,-40 C 25,-45 45,-20 35,25 C 20,40 0,15 0,-40 Z"/>
      <!-- Greenland / Iceland -->
      <path d="M -25,-85 C -15,-90 -5,-80 -15,-75 Z"/>
      <!-- UK -->
      <path d="M -10,-60 C -5,-65 0,-55 -5,-55 Z"/>
    </g>
  </g>
</svg>
